name: tests

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src scripts tests
      - run: bash -n scripts/*.sh
      - run: pytest -q
      - run: python -m pip wheel --no-deps --no-cache-dir --wheel-dir /tmp/vista-wheel .
